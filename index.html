    <title>Asteroid Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Orbitron:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script>
      // Suppression of non-critical extension errors (Chrome extensions, polyfills, etc.)
      window.addEventListener('unhandledrejection', (event) => {
        const msg = event.reason?.message || '';
        const stack = event.reason?.stack || '';
        if (
          msg.includes('Could not establish connection') ||
          msg.includes('Receiving end does not exist') ||
          stack.includes('content.js') ||
          stack.includes('polyfill.js')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('error', (event) => {
        const msg = event.message || '';
        const file = event.filename || '';
        if (msg.includes('runtime.lastError') || file.includes('content.js') || file.includes('polyfill.js')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
